set -g default-terminal "screen-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

unbind %
bind | split-window -h

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.tmux.conf

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -n C-k clear-history

bind -n C-s display-popup -E "\
    tmux list-sessions -F '#{?session_attached,,#{session_name}}' |\
    sed '/^$/d' |\
    fzf --reverse --header jump-to-session --preview 'tmux capture-pane -pt {}'  |\
    xargs tmux switch-client -t"
bind -r m resize-pane -Z

set -g mouse on

set -g focus-events on
set -g status-style bg=default
set -g status-left-length 99
set -g status-right-length 99
set -g status-justify centre

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode after dragging with mouse

set -g mode-style "fg=#352f2d,bg=#868c91"
set -g message-style "fg=#1c1a18,bg=#b4bdc3"
set -g message-command-style "fg=#1c1a18,bg=#b4bdc3"
set -g pane-border-style "fg=#867a74"
set -g pane-active-border-style "fg=#867a74"
set -g status "on"
set -g status-justify "left"
set -g status-style "fg=#867a74,bg=#1c1a18"
set -g status-left-length "100"
set -g status-right-length "100"
set -g status-left-style NONE
set -g status-right-style NONE
set -g status-left "#[fg=#1c1a18,bg=#867a74,bold] #S #[fg=#867a74,bg=#1c1a18,nobold,nounderscore,noitalics]"
set -g status-right "#[fg=#1c1a18,bg=#1c1a18,nobold,nounderscore,noitalics]#[fg=#867a74,bg=#1c1a18]#{prefix_highlight} #[fg=#867a74,bg=#1c1a18,nobold,nounderscore,noitalics]#[fg=#1c1a18,bg=#b4bdc3] %Y-%m-%d | %I:%M %p #[fg=#b4bdc3,bg=#867a74,nobold,nounderscore,noitalics]#[fg=#1c1a18,bg=#867a74,bold] #h "
setw -g window-status-activity-style "underscore,fg=#867a74,bg=#ff0000"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#867a74,bg=#1c1a18"
setw -g window-status-format "#[fg=#1c1a18,bg=#1c1a18,nobold,nounderscore,noitalics]#[default] #I | #W #F #[fg=#1c1a18,bg=#1c1a18,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=#1c1a18,bg=#b4bdc3,nobold,nounderscore,noitalics]#[fg=#1c1a18,bg=#b4bdc3,bold] #I | #W #F #[fg=#b4bdc3,bg=#1c1a18,nobold,nounderscore,noitalics]"


set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes
# set -g @resurrect-capture-pane-contents 'on' # allow tmux-ressurect to capture pane contents
set -g @resurrect-capture-pane-contents 'off' # allow tmux-ressurect to capture pane contents
set -g @continuum-restore 'on'

set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-bind 'v'

run '~/.tmux/plugins/tpm/tpm'
